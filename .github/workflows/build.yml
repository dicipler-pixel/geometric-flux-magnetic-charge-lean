# Build every module, replay every proof in the independent kernel checker,
# audit the axioms of every named theorem, and confirm every false control is
# rejected. A green badge means all four passed on the exact commit shown.
name: Lean proof check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Free disk space (the full Mathlib cache is several GB)
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve Mathlib at the pinned tag and fetch its prebuilt cache
        run: |
          set -euo pipefail
          lean --version
          lake update
          lake exe cache get
          df -h /

      - name: Build every module
        run: |
          set +e -uo pipefail
          lake build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "--- errors ---"
            grep -A 8 -E "error" build.log | head -200 || true
            python3 - <<'PY'
          lines = open("build.log").read().splitlines()
          hits = [i for i, l in enumerate(lines) if "error:" in l]
          tail = "\n".join(lines[-40:])
          print("::error title=build tail::" + tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:4000])
          for i in hits[:15]:
              block = "\n".join(lines[i:i + 12])
              flat = block.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::error title=lean build::" + flat[:4000])
          PY
            exit "$status"
          fi

      - name: Replay every module in the independent kernel checker
        run: |
          set -euo pipefail
          mods=$(python3 -c "import json; print(' '.join(m['module'] for m in json.load(open('scripts/config.json'))['modules']))")
          for m in $mods; do
            echo "== $m"
            lake env leanchecker "$m"
          done

      - name: Axiom audit, theorem inventory and false controls
        run: python3 scripts/verify.py

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-evidence
          path: |
            build.log
            verification/
            lake-manifest.json
          if-no-files-found: warn
          retention-days: 90

  # The original 24-theorem package, unchanged, on its own pinned toolchain
  # (Lean v4.19.0 and the Mathlib commit in monopole_stance/lake-manifest.json).
  monopole_stance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: monopole_stance
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Free disk space (the full Mathlib cache is several GB)
        working-directory: .
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the pinned Mathlib's prebuilt cache
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get

      - name: Build, axiom audit and six negative controls
        run: python3 scripts/verify.py

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monopole-stance-evidence
          path: |
            monopole_stance/verification/
            monopole_stance/AxiomAudit.lean
          if-no-files-found: warn
          retention-days: 90
